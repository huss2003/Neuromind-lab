# Only if you run the grader in WSL instead of a separate virtual machine (a VM is recommended).
# Copy to /etc/wsl.conf inside the WSL distribution, then run `wsl --shutdown` in Windows PowerShell and start WSL again.
[automount]
enabled = false        # do not mount C:, D:, ... inside Linux
mountFsTab = false
[interop]
enabled = false        # Linux cannot start Windows programs
appendWindowsPath = false
[boot]
systemd = true         # needed for the docker and neuromind-worker services
