name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 scripts/check_secrets.py
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r backend/requirements.txt ruff
      - run: ruff check backend grader scripts
      - run: python scripts/content_pack.py validate content/lectures   # lecture packs must stay valid
      - run: cd backend && pytest -q
  grader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r grader/requirements.txt
      - run: docker build -t neuromind-grader-sandbox grader/
      - run: cd grader && pytest -q   # includes the Docker-backed tests because Docker exists on this runner
  grader-gvisor:
    # The self-hosted grader runs learner code under gVisor (runsc). This proves the isolation tests and every lab's
    # reference solution pass under that runtime, with the pinned sandbox image (hidden checks are private: PARTIAL run).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r grader/requirements.txt -r backend/requirements.txt
      - name: Install gVisor and register it with Docker
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -q && sudo apt-get install -y -q runsc
          sudo runsc install && sudo systemctl restart docker
          docker run --rm --runtime=runsc hello-world
      - run: docker build -t neuromind-grader-sandbox grader/
      - run: cd grader && GRADER_RUNTIME=runsc pytest -q -rs
      - run: GRADER_RUNTIME=runsc python scripts/verify_labs.py content/lectures --sandbox
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: cd frontend && pnpm exec playwright install --with-deps chromium && pnpm test:ui
